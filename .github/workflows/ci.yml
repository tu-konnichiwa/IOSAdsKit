name: Swift package checks
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core behavior tests
        run: swift test --enable-code-coverage
      - name: iOS driver build
        run: >-
          xcodebuild -scheme IOSAdsKitGoogleMobileAds
          -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/IOSAdsKit-device
          CODE_SIGNING_ALLOWED=NO build
      - name: iOS simulator driver build
        run: >-
          xcodebuild -scheme IOSAdsKitGoogleMobileAds
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/IOSAdsKit-simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Integration example compile check
        run: |
          xcrun swiftc -swift-version 6 -typecheck \
            -target arm64-apple-ios15.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I /tmp/IOSAdsKit-device/Build/Products/Debug-iphoneos \
            -F /tmp/IOSAdsKit-device/Build/Products/Debug-iphoneos \
            -F /tmp/IOSAdsKit-device/Build/Products/Debug-iphoneos/PackageFrameworks \
            Examples/AdsIntegration.swift
